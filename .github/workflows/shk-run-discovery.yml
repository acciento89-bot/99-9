name: SHK Bridge Run Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/shk-run-discovery.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover latest SHK TestFlight Bridge runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${REPO}/actions/workflows/shk-testflight.yml/runs?per_page=10"
          RESPONSE=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API")
          COUNT=$(jq '.workflow_runs | length' <<<"$RESPONSE")
          echo "SHK_BRIDGE_RUN_COUNT=$COUNT"
          jq -r '.workflow_runs[] | "SHK_BRIDGE_RUN id=\(.id) status=\(.status) conclusion=\(.conclusion // "null") event=\(.event) head_sha=\(.head_sha) created=\(.created_at) updated=\(.updated_at) url=\(.html_url)"' <<<"$RESPONSE"
          LATEST=$(jq -r '.workflow_runs[0].id // empty' <<<"$RESPONSE")
          test -n "$LATEST"
          echo "LATEST_SHK_BRIDGE_RUN_ID=$LATEST"
