name: App Store Screenshot Replacement

on:
  push:
    branches: [main]
    paths:
      - '.github/store-screenshot-replace-request.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replace:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v5
      - name: Replace iPhone screenshots in App Store Connect
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: bash .github/scripts/store_replace_screenshots.sh
