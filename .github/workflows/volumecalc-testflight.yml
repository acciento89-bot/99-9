name: VolumeCalc TestFlight Bridge

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: VolumeCalc branch/tag/commit
        required: true
        default: main
        type: string
      marketing_version:
        description: App version
        required: true
        default: "1.0"
        type: string
      build_number:
        description: TestFlight build number
        required: true
        default: "1"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/volumecalc-release-request.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/volumecalc-release-request.json'

permissions:
  contents: read

env:
  VOLUMECALC_REPO: acciento89-bot/AnlagenVolumen
  VOLUMECALC_BUNDLE_ID: de.kamilunavo.volumecalc
  APPLE_TEAM_ID: TKG684N5GL

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout bridge release request
        uses: actions/checkout@v5
        with:
          path: bridge

      - name: Resolve VolumeCalc release request
        id: release
        shell: bash
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_VERSION: ${{ inputs.marketing_version }}
          DISPATCH_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_REF="$DISPATCH_SOURCE_REF"
            RELEASE_VERSION="$DISPATCH_VERSION"
            RELEASE_BUILD="$DISPATCH_BUILD"
          else
            REQUEST="bridge/.github/volumecalc-release-request.json"
            test -s "$REQUEST"
            SOURCE_REF=$(jq -er '.source_ref' "$REQUEST")
            RELEASE_VERSION=$(jq -er '.marketing_version' "$REQUEST")
            RELEASE_BUILD=$(jq -er '.build_number' "$REQUEST")
            jq -e '.app == "VolumeCalc"' "$REQUEST" >/dev/null
            jq -e '.repository == "acciento89-bot/AnlagenVolumen"' "$REQUEST" >/dev/null
            jq -e '.bundle_id == "de.kamilunavo.volumecalc"' "$REQUEST" >/dev/null
            jq -e '.sku == "volumecalc-001"' "$REQUEST" >/dev/null
          fi
          test -n "$SOURCE_REF"
          test -n "$RELEASE_VERSION"
          [[ "$RELEASE_BUILD" =~ ^[0-9]+$ ]]
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD=$RELEASE_BUILD" >> "$GITHUB_ENV"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$RELEASE_BUILD" >> "$GITHUB_OUTPUT"
          printf 'Resolved release request: VolumeCalc %s (%s) from %s\n' "$RELEASE_VERSION" "$RELEASE_BUILD" "$SOURCE_REF"

      - name: Checkout VolumeCalc
        uses: actions/checkout@v5
        with:
          repository: ${{ env.VOLUMECALC_REPO }}
          ref: ${{ steps.release.outputs.source_ref }}
          path: volumecalc

      - name: Verify VolumeCalc identity
        shell: bash
        run: |
          set -euo pipefail
          cd volumecalc
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = de.kamilunavo.volumecalc' AnlagenVolumen.xcodeproj/project.pbxproj
          grep -q 'INFOPLIST_KEY_CFBundleDisplayName = VolumeCalc' AnlagenVolumen.xcodeproj/project.pbxproj
          grep -q '\*\*SKU:\*\* volumecalc-001' APP_STORE.md
          xcodebuild -project AnlagenVolumen.xcodeproj -scheme VolumeCalc -list
          printf 'Release identity: VolumeCalc %s (%s) / %s\n' "$RELEASE_VERSION" "$RELEASE_BUILD" "$VOLUMECALC_BUNDLE_ID"

      - name: Run VolumeCalc core tests
        shell: bash
        run: |
          set -euo pipefail
          cd volumecalc
          swift test

      - name: Install App Store Connect API key
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_PRIVATE_KEY_B64"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'PRIVATE KEY' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Verify App Store Connect app record
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          JWT=$(ruby <<'RUBY'
          require 'openssl'; require 'base64'; require 'json'
          def b(v); Base64.urlsafe_encode64(v,padding:false); end
          key=OpenSSL::PKey.read(File.read(ENV.fetch('ASC_KEY_PATH'))); now=Time.now.to_i
          h=b(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'})); p=b(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+900,aud:'appstoreconnect-v1'})); s="#{h}.#{p}"
          seq=OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new,s)); raw=seq.value.map{|i|[i.value.to_i.to_s(16).rjust(64,'0')].pack('H*')}.join
          puts "#{s}.#{b(raw)}"
          RUBY
          )
          APPS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer $JWT" --data-urlencode "filter[bundleId]=$VOLUMECALC_BUNDLE_ID" --data-urlencode 'limit=10' 'https://api.appstoreconnect.apple.com/v1/apps')
          APP_ID=$(jq -r '.data[0].id // empty' <<<"$APPS")
          test -n "$APP_ID"
          echo "ASC_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "App Store Connect app record found: $APP_ID"

      - name: Create unsigned iOS release archive
        shell: bash
        run: |
          set -euo pipefail
          cd volumecalc
          ARCHIVE="$RUNNER_TEMP/VolumeCalc.xcarchive"
          rm -rf "$ARCHIVE"
          xcodebuild \
            -project AnlagenVolumen.xcodeproj \
            -scheme VolumeCalc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$VOLUMECALC_BUNDLE_ID" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive
          APP="$ARCHIVE/Products/Applications/VolumeCalc.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx "$VOLUMECALC_BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$RELEASE_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx "$RELEASE_BUILD"

      - name: Create App Store export options
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Cloud-sign VolumeCalc IPA
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/VolumeCalcExport"
          mkdir -p "$RUNNER_TEMP/VolumeCalcExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/VolumeCalc.xcarchive" \
            -exportPath "$RUNNER_TEMP/VolumeCalcExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA=$(find "$RUNNER_TEMP/VolumeCalcExport" -maxdepth 2 -type f -name '*.ipa' -print -quit)
          test -n "$IPA" -a -s "$IPA"
          echo "VOLUMECALC_IPA=$IPA" >> "$GITHUB_ENV"

      - name: Verify Apple Distribution signature
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/SignedVolumeCalc"
          mkdir -p "$RUNNER_TEMP/SignedVolumeCalc"
          unzip -q "$VOLUMECALC_IPA" -d "$RUNNER_TEMP/SignedVolumeCalc"
          SIGNED_APP=$(find "$RUNNER_TEMP/SignedVolumeCalc/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -d "$SIGNED_APP"
          codesign --verify --deep --strict --verbose=2 "$SIGNED_APP"
          INFO=$(codesign -dvv "$SIGNED_APP" 2>&1)
          grep -q '^Authority=Apple Distribution' <<<"$INFO"

      - name: Validate IPA with App Store Connect
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --file "$VOLUMECALC_IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json

      - name: Upload VolumeCalc to TestFlight
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --file "$VOLUMECALC_IPA" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolumeCalc-${{ steps.release.outputs.marketing_version }}-${{ steps.release.outputs.build_number }}
          path: ${{ runner.temp }}/VolumeCalcExport/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove App Store Connect key
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        shell: bash
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8
