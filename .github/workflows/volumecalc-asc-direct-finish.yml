name: VolumeCalc ASC Direct Finish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/volumecalc-asc-direct-request.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finish:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v5

      - name: Finalize VolumeCalc in App Store Connect
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: bash .github/scripts/volumecalc_asc_finalize.sh
