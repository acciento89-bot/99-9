name: Android central-signed bundle
'on':
  workflow_dispatch: null

permissions:
  contents: read
concurrency:
  group: android-central-bundle
  cancel-in-progress: false
env:
  RELEASE_WORKFLOW: .github/workflows/android-central-bundle.yml
  BUNDLETOOL_SHA256: 378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584
  CENTRAL_SHA1: BCF2337D41E617C03BCAE698C09D1523654BD790
  CENTRAL_SHA256: 7985BD6B33711BACA7E6BA722C2B3870EBBC802F7DB4A7BC1206BDAE51C4D5D6
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'acciento89-bot/99-9'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      artifact_id: ${{ steps.transfer.outputs.artifact-id }}
      artifact_digest: ${{ steps.transfer.outputs.artifact-digest }}
    permissions:
      contents: read
      actions: read
    env:
      APP_ID: 99-9
      PACKAGE_NAME: de.kamilunavo.ninenine
      EXPECTED_VERSION_CODE: '8'
      EXPECTED_VERSION_NAME: 1.2.0
      GODOT_VERSION: 4.7.2
      GODOT_TAG: 4.7.2-stable
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Validate Android release metadata and pinned licence packaging
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python3 scripts/test_android_release_source.py
        python3 .github/scripts/test_godot_release_payload.py -v
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Validate identical launcher and Store artwork
      run: |
        python3 -m pip install Pillow
        python3 scripts/check_launcher_icons.py
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install Android SDK
      run: |
        set -euo pipefail
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
    - name: Install Godot Android toolchain
      run: |
        set -euo pipefail
        bash scripts/ci_install_admob.sh android
        printf '%s  %s\n' 0d504a40b92db1abfdf839724c3a962a56569def93dbc608c9537fa38710e65a "$RUNNER_TEMP/ninenine-admob-native/android-template-v4.7.2.zip" | sha256sum --check --strict
        curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
        printf '%s  %s\n' "$GODOT_LINUX_SHA256" godot.zip | sha256sum --check --strict
        unzip -q godot.zip
        mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
        chmod +x godot
        T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
        mkdir -p "$T" templates android/build build/android
        curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
        printf '%s  %s\n' "$GODOT_TEMPLATES_SHA256" templates.tpz | sha256sum --check --strict
        unzip -q templates.tpz -d templates
        cp -R templates/templates/. "$T/"
        unzip -q "$T/android_source.zip" -d android/build
        printf '%s\n' "${GODOT_VERSION}.stable" > android/.build_version
        chmod +x android/build/gradlew
    - name: Validate precision rules and durable archive before export
      run: |
        set -euo pipefail
        bash scripts/run-practice-core-tests.sh "$GITHUB_WORKSPACE/godot"
        bash scripts/run-practice-archive-tests.sh "$GITHUB_WORKSPACE/godot"
        bash scripts/run-practice-integration-tests.sh "$GITHUB_WORKSPACE/godot"
        python3 scripts/test_original_audio.py
        bash scripts/run-audio-tests.sh "$GITHUB_WORKSPACE/godot"
    - name: Export release AAB with temporary build-only identity
      run: |-
        set -euo pipefail
        keytool -genkeypair -keystore "$RUNNER_TEMP/build-only.p12" -storetype PKCS12 -storepass build-only-password -keypass build-only-password -alias build-only -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Temporary Build Only'
        python3 - <<'PY'
        from pathlib import Path
        import os
        p=Path('export_presets.cfg'); s=p.read_text()
        assert s.count('version/code=8')==1
        assert s.count('version/name="1.2.0"')==1
        lines=[l for l in s.splitlines() if not l.startswith(('keystore/release=','keystore/release_user=','keystore/release_password='))]
        s='\n'.join(lines)+'\n'
        anchor='gradle_build/export_format=1'
        assert s.count(anchor)==1
        s=s.replace(anchor,anchor+'\nkeystore/release="'+os.environ['RUNNER_TEMP']+'/build-only.p12"\nkeystore/release_user="build-only"\nkeystore/release_password="build-only-password"')
        p.write_text(s)
        PY
        ./godot --headless --editor --path . --quit
        ./godot --headless --path . --export-release "Android Playtest" build/android/99-9.aab
        test -s build/android/99-9.aab
        unzip -l build/android/99-9.aab | grep -Ei 'GodotIap|billing' >/dev/null
        rm -f "$RUNNER_TEMP/build-only.p12"
    - name: Stage bundle for isolated signing
      run: |-
        set -euo pipefail
        AAB="build/android/99-9.aab"
        test -s "$AAB"
        python3 .github/scripts/godot_release_payload.py prepare --input "$AAB" --out unsigned
    - id: transfer
      uses: actions/upload-artifact@v4
      with:
        name: central-input-99-9-${{ github.run_id }}
        path: unsigned/
        if-no-files-found: error
        retention-days: 30
  sign:
    if: github.ref == 'refs/heads/main' && github.repository == 'acciento89-bot/99-9'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      APP_ID: 99-9
      PACKAGE_NAME: de.kamilunavo.ninenine
      EXPECTED_VERSION_CODE: '8'
      EXPECTED_VERSION_NAME: 1.2.0
    steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Fetch the exact immutable unsigned source artifact
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        SOURCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/source-artifact.json"
        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/source-artifact.zip"
        python3 .github/scripts/godot_release_payload.py unpack --archive "$RUNNER_TEMP/source-artifact.zip" --metadata "$RUNNER_TEMP/source-artifact.json" --digest "$SOURCE_ARTIFACT_DIGEST" --artifact-id "$SOURCE_ARTIFACT_ID" --artifact-name "central-input-99-9-$GITHUB_RUN_ID" --out input
    - name: Validate bundle identity before restoring signing material
      run: |-
        set -euo pipefail
        test "$(cat input/source-commit.txt)" = "$GITHUB_SHA"
        test -s input/app.aab
        curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
        printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
        python3 .github/scripts/godot_release_payload.py recheck --input input
        java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=input/app.aab
        package=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=input/app.aab --xpath='/manifest/@package')
        code=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=input/app.aab --xpath='/manifest/@android:versionCode')
        test "$package" = "$PACKAGE_NAME"
        test "$code" = "$EXPECTED_VERSION_CODE"
        name=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=input/app.aab --xpath='/manifest/@android:versionName')
        test "$name" = "$EXPECTED_VERSION_NAME"
        java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=input/app.aab --module=assetPackInstallTime > "$RUNNER_TEMP/install-time.xml"
        python3 .github/scripts/godot_release_payload.py pack --input "$RUNNER_TEMP/install-time.xml"
        mkdir -p signed
        cp input/app.aab signed/app.aab
    - name: Restore verified central upload identity
      uses: acciento89-bot/maengelfix/.github/actions/restore-central-android-signing@14bbf9332ccf58a2304027628da748ff4c6b3e61
    - name: Sign and independently verify central release bundle
      run: |-
        set -euo pipefail
        expected='BCF2337D41E617C03BCAE698C09D1523654BD790'
        test "$KAMILUNAVO_CENTRAL_UPLOAD_SHA1" = "$CENTRAL_SHA1"
        test "$KAMILUNAVO_CENTRAL_UPLOAD_SHA256" = "$CENTRAL_SHA256"
        jarsigner -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" -storetype PKCS12 -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD -keypass:env ANDROID_UPLOAD_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 signed/app.aab "$ANDROID_UPLOAD_KEY_ALIAS"
        jarsigner -verify signed/app.aab > "$RUNNER_TEMP/verification.txt"
        grep -Fq 'jar verified.' "$RUNNER_TEMP/verification.txt"
        keytool -J-Duser.language=en -printcert -jarfile signed/app.aab > "$RUNNER_TEMP/certificate.txt"
        actual=$(sed -n 's/^[[:space:]]*SHA1: //p' "$RUNNER_TEMP/certificate.txt" | tr -d ':\r\n ')
        test "$actual" = "$CENTRAL_SHA1"
        actual_sha256=$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/certificate.txt" | tr -d ':\r\n ')
        test "$actual_sha256" = "$CENTRAL_SHA256"
        cp "$RUNNER_TEMP/certificate.txt" signed/upload-certificate.txt
        java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=signed/app.aab
        test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=signed/app.aab --xpath='/manifest/@package')" = "$PACKAGE_NAME"
        test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=signed/app.aab --xpath='/manifest/@android:versionCode')" = "$EXPECTED_VERSION_CODE"
        test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=signed/app.aab --xpath='/manifest/@android:versionName')" = "$EXPECTED_VERSION_NAME"
        filename="$APP_ID-v$EXPECTED_VERSION_CODE-central.aab"
        mv signed/app.aab "signed/$filename"
        python3 .github/scripts/godot_release_payload.py finish --input input --signed "signed/$filename"
        (cd signed && sha256sum "$filename" > "$filename.sha256")
        jq -n --arg package "$PACKAGE_NAME" --argjson versionCode "$EXPECTED_VERSION_CODE" --arg certificateSha1 "$actual" --arg sourceCommit "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" '{package:$package,versionCode:$versionCode,certificateSha1:$certificateSha1,sourceCommit:$sourceCommit,runId:$runId}' > signed/release-evidence.json
        printf '%s versionCode %s central-signed and verified. No Play changes.\n' "$PACKAGE_NAME" "$EXPECTED_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
    - name: Destroy restored signing material
      if: always()
      run: |-
        rm -f "$RUNNER_TEMP/kamilunavo-central-upload.p12"
        rm -rf "$RUNNER_TEMP/kamilunavo-central-signing"
    - name: Preserve verified release bundle
      uses: actions/upload-artifact@v4
      with:
        name: 99-9-v8-central-signed-aab
        path: signed/
        if-no-files-found: error
        retention-days: 30
