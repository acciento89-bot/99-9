# Final 99.9 App Store submission workflow
name: 99.9 Final App Store Submit

on:
  pull_request:
    paths:
      - '.github/workflows/ios-appstore-final-submit.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BUNDLE_ID: de.kamilunavo.ninenine
  BUILD_NUMBER: '16'
  RELEASE_BRANCH: ios/storekit-connection-fix

jobs:
  submit:
    name: Final metadata and App Review submit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ios/storekit-connection-fix

      - name: Install dependencies
        run: python3 -m pip install --quiet pyjwt cryptography requests

      - name: Finalize metadata and submit Build 16
        id: submit
        shell: bash
        run: |
          set +e
          mkdir -p validation
          python3 - <<'PY' 2>&1 | tee /tmp/final-submit.log
          import os, time, base64, json
          import jwt, requests

          BASE='https://api.appstoreconnect.apple.com/v1'
          BUNDLE=os.environ['BUNDLE_ID']
          BUILD_NO=os.environ['BUILD_NUMBER']
          EULA='https://www.apple.com/legal/internet-services/itunes/dev/stdeula/'
          EULA_LINE='Terms of Use (EULA): '+EULA

          DE='''Wie nah kommst du an 100 %?

99.9% ist ein minimalistisches One-Tap-Präzisionsspiel: Starte den Lauf, beobachte die Prozentanzeige und stoppe sie im perfekten Moment. Klingt einfach – bis du versuchst, 99,900 % oder sogar exakt 100,000 % zu treffen.

DEINE HERAUSFORDERUNG
• Ein Tipp startet den Versuch, der nächste stoppt ihn.
• Erreiche mindestens 99,900 %, um deine Serie fortzusetzen.
• Jage deinem persönlichen Bestwert hinterher.
• Vergleiche dich in der weltweiten Bestenliste.
• Verfolge Bestwert, längste Serie und gespielte Runden in deinen Statistiken.

SCHNELL. EINFACH. GEMEIN.
Jeder Versuch dauert nur wenige Sekunden. Genau deshalb ist „nur noch eine Runde“ so schwer zu widerstehen.

PERSONALISIERUNG
Wähle deinen Spielernamen und passe das Erscheinungsbild mit zusätzlichen Designs an. Optionale In-App-Käufe ermöglichen weitere Designs sowie das Entfernen von Werbung.

99.9% konzentriert sich auf eine einzige Frage: Wie nah kommst du wirklich an 100 %?'''

          EN='''How close can you get to 100%?

99.9% is a minimalist one-tap precision game. Start the run, watch the percentage climb, and stop it at exactly the right moment. It sounds simple—until you try to hit 99.900% or even a perfect 100.000%.

YOUR CHALLENGE
• One tap starts the attempt, the next one stops it.
• Reach at least 99.900% to keep your streak alive.
• Chase your personal best.
• Compare your results on the worldwide leaderboard.
• Track your best hit, longest streak and rounds played in your stats.

FAST. SIMPLE. BRUTAL.
Each attempt only takes a few seconds. That is exactly why “one more try” is so hard to resist.

PERSONALIZE IT
Choose your player name and customize the look with additional themes. Optional in-app purchases unlock more themes and let you remove ads.

99.9% is built around one question: how close can you really get to 100%?'''

          kid=os.environ['ASC_KEY_ID']; iss=os.environ['ASC_ISSUER_ID']
          raw=os.environ['ASC_PRIVATE_KEY_B64']
          if not kid or not iss or not raw:
              raise RuntimeError('ASC credentials missing')
          key=base64.b64decode(raw).decode('utf-8')
          now=int(time.time())
          token=jwt.encode({'iss':iss,'iat':now,'exp':now+1100,'aud':'appstoreconnect-v1'},key,algorithm='ES256',headers={'kid':kid,'typ':'JWT'})
          H={'Authorization':f'Bearer {token}','Content-Type':'application/json'}

          def req(method,path,params=None,body=None,ok=(200,201,204)):
              r=requests.request(method,BASE+path,headers=H,params=params,json=body,timeout=60)
              if r.status_code not in ok:
                  print(f'ASC ERROR {method} {path}: HTTP {r.status_code}')
                  try: print(json.dumps(r.json(),indent=2))
                  except: print(r.text)
                  raise RuntimeError(f'{method} {path} HTTP {r.status_code}')
              if r.status_code==204 or not r.content: return None
              return r.json()

          app=req('GET','/apps',{'filter[bundleId]':BUNDLE,'limit':'5'})['data']
          if len(app)!=1: raise RuntimeError(f'Expected one app for {BUNDLE}, found {len(app)}')
          app_id=app[0]['id']
          print('APP',app_id,BUNDLE)

          req('PATCH',f'/apps/{app_id}',body={'data':{'type':'apps','id':app_id,'attributes':{'contentRightsDeclaration':'USES_THIRD_PARTY_CONTENT'}}})
          print('Content rights set.')

          versions=req('GET',f'/apps/{app_id}/appStoreVersions',{
              'filter[platform]':'IOS','limit':'50','fields[appStoreVersions]':'platform,versionString,appVersionState,releaseType,build'
          })['data']
          candidates=[v for v in versions if v.get('attributes',{}).get('versionString') in ('1.0','1.0.0')]
          if not candidates: raise RuntimeError('No iOS App Store version 1.0/1.0.0 found')
          editable={'PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED','METADATA_REJECTED','REJECTED'}
          version=next((v for v in candidates if v.get('attributes',{}).get('appVersionState') in editable),candidates[0])
          version_id=version['id']; state=version.get('attributes',{}).get('appVersionState')
          print('VERSION',version_id,state)

          locs=req('GET',f'/appStoreVersions/{version_id}/appStoreVersionLocalizations',{
              'limit':'50','fields[appStoreVersionLocalizations]':'locale,description'
          })['data']
          if not locs: raise RuntimeError('No App Store version localizations found')

          def description_for(locale):
              base=DE if str(locale).lower().startswith('de') else EN
              return base.rstrip()+'\n\n'+EULA_LINE

          for loc in locs:
              lid=loc['id']; locale=loc.get('attributes',{}).get('locale','en-US')
              desc=description_for(locale)
              if len(desc)>4000: raise RuntimeError('Generated description exceeds 4000 chars')
              req('PATCH',f'/appStoreVersionLocalizations/{lid}',body={
                  'data':{'type':'appStoreVersionLocalizations','id':lid,'attributes':{'description':desc}}
              })
              print('DESCRIPTION FIXED',locale,len(desc))

          check=req('GET',f'/appStoreVersions/{version_id}/appStoreVersionLocalizations',{
              'limit':'50','fields[appStoreVersionLocalizations]':'locale,description'
          })['data']
          for loc in check:
              d=(loc.get('attributes',{}).get('description') or '').rstrip()
              if d==EULA_LINE or not d.endswith(EULA_LINE) or len(d)<500:
                  raise RuntimeError('Description/EULA verification failed for '+str(loc.get('attributes',{}).get('locale')))
          print('Descriptions restored; EULA verified as final line.')

          builds=req('GET','/builds',{
              'filter[app]':app_id,'filter[version]':BUILD_NO,'limit':'20','sort':'-uploadedDate',
              'fields[builds]':'version,uploadedDate,processingState,buildAudienceType,usesNonExemptEncryption'
          })['data']
          valid=[b for b in builds if b.get('attributes',{}).get('processingState')=='VALID']
          if not valid: raise RuntimeError('Build 16 is not VALID')
          build_id=valid[0]['id']
          req('PATCH',f'/appStoreVersions/{version_id}/relationships/build',body={'data':{'type':'builds','id':build_id}},ok=(204,))
          print('BUILD ATTACHED',build_id)

          submissions=req('GET',f'/apps/{app_id}/reviewSubmissions',{
              'limit':'100','fields[reviewSubmissions]':'platform,submittedDate,state'
          })['data']
          terminal={'WAITING_FOR_REVIEW','IN_REVIEW'}
          waiting=[s for s in submissions if s.get('attributes',{}).get('state') in terminal]
          if state in terminal or waiting:
              print('Already submitted/in review.')
              final_state=state if state in terminal else waiting[0].get('attributes',{}).get('state')
              submission_id=waiting[0]['id'] if waiting else 'existing'
          else:
              ready=[s for s in submissions if s.get('attributes',{}).get('state')=='READY_FOR_REVIEW']
              if ready:
                  sub=ready[0]
              else:
                  sub=req('POST','/reviewSubmissions',body={'data':{
                      'type':'reviewSubmissions','attributes':{'platform':'IOS'},
                      'relationships':{'app':{'data':{'type':'apps','id':app_id}}}
                  }})['data']
              submission_id=sub['id']
              print('SUBMISSION',submission_id)

              items=req('GET',f'/reviewSubmissions/{submission_id}/items',{
                  'limit':'200','include':'appStoreVersion',
                  'fields[reviewSubmissionItems]':'state,appStoreVersion',
                  'fields[appStoreVersions]':'versionString,appVersionState'
              })['data']
              linked=False
              for item in items:
                  rel=item.get('relationships',{}).get('appStoreVersion',{}).get('data')
                  if rel and rel.get('id')==version_id: linked=True
              if not linked:
                  req('POST','/reviewSubmissionItems',body={'data':{
                      'type':'reviewSubmissionItems',
                      'relationships':{
                          'reviewSubmission':{'data':{'type':'reviewSubmissions','id':submission_id}},
                          'appStoreVersion':{'data':{'type':'appStoreVersions','id':version_id}}
                      }
                  }})
                  print('VERSION ADDED TO SUBMISSION')

              result=req('PATCH',f'/reviewSubmissions/{submission_id}',body={'data':{
                  'type':'reviewSubmissions','id':submission_id,'attributes':{'submitted':True}
              }})['data']
              final_state=result.get('attributes',{}).get('state')
              print('SUBMIT ACCEPTED',final_state)
              for _ in range(18):
                  if final_state in terminal: break
                  time.sleep(5)
                  result=req('GET',f'/reviewSubmissions/{submission_id}')['data']
                  final_state=result.get('attributes',{}).get('state')
                  print('STATE',final_state)
              if final_state not in terminal:
                  raise RuntimeError('Submission did not reach WAITING_FOR_REVIEW/IN_REVIEW; state='+str(final_state))

          out=os.path.join(os.environ['GITHUB_WORKSPACE'],'validation','appstore-final-submit-result.txt')
          with open(out,'w',encoding='utf-8') as f:
              f.write('result=success\n')
              f.write(f'bundle={BUNDLE}\n')
              f.write(f'build={BUILD_NO}\n')
              f.write('description_restored=true\n')
              f.write('eula_at_description_end=true\n')
              f.write('review_contact_added=false\n')
              f.write('review_notes_added=false\n')
              f.write(f'review_state={final_state}\n')
              f.write(f'review_submission_id={submission_id}\n')
          print('FINAL SUCCESS',final_state)
          PY
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo 'result=failure'
              echo 'bundle=de.kamilunavo.ninenine'
              echo 'build=16'
              echo '--- last log lines ---'
              tail -n 80 /tmp/final-submit.log
            } > validation/appstore-final-submit-result.txt
            echo 'result=failure' >> "$GITHUB_OUTPUT"
          else
            echo 'result=success' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Record final App Store result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kamilunavo Release Bot'
          git config user.email 'acciento89@gmail.com'
          git add validation/appstore-final-submit-result.txt
          if git diff --cached --quiet; then
            echo 'Result unchanged.'
          else
            git commit -m 'Record 99.9 final App Store submission result'
            git push origin HEAD:ios/storekit-connection-fix
          fi

      - name: Fail if submission failed
        if: steps.submit.outputs.result != 'success'
        run: exit 1
