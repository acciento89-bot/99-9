name: Trigger Clean iPad Screenshot

on:
  push:
    branches:
      - ios/app-review-build17
    paths:
      - .github/workflows/trigger-build17-apple-clean.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apple-only iPad screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ipad-build17-screenshot.yml --repo "$GITHUB_REPOSITORY" --ref ios/app-review-build17
