name: Store Review Resubmit All

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/volumecalc-store-request.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resubmit-all:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v5
        with:
          path: bridge

      - name: Resubmit five SHK apps with Build 4
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: bash bridge/.github/scripts/shk_build4_review_replace.sh

      - name: Resubmit VolumeCalc with Build 3
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: bash bridge/.github/scripts/volumecalc_build3_review_replace.sh
