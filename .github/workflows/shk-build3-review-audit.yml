name: SHK Build 3 Review Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/shk-build3-review-audit-request.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v5
        with:
          path: bridge

      - name: Audit all five SHK App Store versions
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: bash bridge/.github/scripts/shk_build3_review_audit.sh
