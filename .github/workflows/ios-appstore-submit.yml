name: 99.9 App Store Submit

on:
  push:
    branches:
      - ios/storekit-connection-fix
    paths:
      - '.github/workflows/ios-appstore-submit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ID: de.kamilunavo.ninenine
  BUILD_NUMBER: '16'

jobs:
  submit:
    name: Finalize App Store Connect and submit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
    steps:
      - name: Verify ASC credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY_B64"

      - name: Install App Store Connect API dependencies
        shell: bash
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests

      - name: Add Apple EULA, attach Build 16 and submit for App Review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time, base64, json, sys
          import jwt, requests

          BASE = 'https://api.appstoreconnect.apple.com/v1'
          EULA_URL = 'https://www.apple.com/legal/internet-services/itunes/dev/stdeula/'
          EULA_SUFFIX = '\n\nTerms of Use (EULA): ' + EULA_URL
          bundle_id = os.environ['BUNDLE_ID']
          build_number = os.environ['BUILD_NUMBER']
          key_id = os.environ['ASC_KEY_ID']
          issuer_id = os.environ['ASC_ISSUER_ID']
          private_key = base64.b64decode(os.environ['ASC_PRIVATE_KEY_B64']).decode('utf-8')
          now = int(time.time())
          token = jwt.encode(
              {'iss': issuer_id, 'iat': now, 'exp': now + 1100, 'aud': 'appstoreconnect-v1'},
              private_key,
              algorithm='ES256',
              headers={'kid': key_id, 'typ': 'JWT'},
          )
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def call(method, path, *, params=None, body=None, ok=(200,201,204)):
              r = requests.request(method, BASE + path, headers=headers, params=params, json=body, timeout=45)
              if r.status_code not in ok:
                  print(f'ASC ERROR {method} {path}: HTTP {r.status_code}')
                  try:
                      print(json.dumps(r.json(), indent=2))
                  except Exception:
                      print(r.text)
                  raise SystemExit(1)
              if r.status_code == 204 or not r.content:
                  return None
              return r.json()

          apps = call('GET', '/apps', params={'filter[bundleId]': bundle_id, 'limit': '5'})['data']
          if len(apps) != 1:
              print(f'Expected exactly one app for {bundle_id}, found {len(apps)}')
              raise SystemExit(1)
          app_id = apps[0]['id']
          print(f'App found: {bundle_id} / {app_id}')

          versions = call('GET', f'/apps/{app_id}/appStoreVersions', params={
              'filter[platform]': 'IOS',
              'limit': '50',
              'fields[appStoreVersions]': 'platform,versionString,appVersionState,releaseType,build'
          })['data']
          candidates = [v for v in versions if v.get('attributes', {}).get('versionString') in ('1.0', '1.0.0')]
          if not candidates:
              print('No iOS App Store version 1.0/1.0.0 exists in App Store Connect.')
              raise SystemExit(1)
          editable_states = {'PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED','METADATA_REJECTED','REJECTED'}
          editable = [v for v in candidates if v.get('attributes',{}).get('appVersionState') in editable_states]
          version = editable[0] if editable else candidates[0]
          version_id = version['id']
          attrs = version.get('attributes', {})
          state = attrs.get('appVersionState')
          print('Selected App Store version:', attrs.get('versionString'), state, version_id)

          # Apple standard EULA must be at the end of every App Store description before submission.
          locs = call('GET', f'/appStoreVersions/{version_id}/appStoreVersionLocalizations', params={
              'limit': '50',
              'fields[appStoreVersionLocalizations]': 'locale,description'
          })['data']
          if not locs:
              print('No App Store version localizations found; cannot guarantee EULA in description.')
              raise SystemExit(1)
          for loc in locs:
              loc_id = loc['id']
              locale = loc.get('attributes', {}).get('locale', 'unknown')
              desc = loc.get('attributes', {}).get('description') or ''
              if EULA_URL in desc:
                  before = desc.split(EULA_URL, 1)[0]
                  before = before.rsplit('Terms of Use (EULA):', 1)[0].rstrip()
                  new_desc = before + EULA_SUFFIX
              else:
                  max_base = 4000 - len(EULA_SUFFIX)
                  new_desc = desc[:max_base].rstrip() + EULA_SUFFIX
              call('PATCH', f'/appStoreVersionLocalizations/{loc_id}', body={
                  'data': {
                      'type': 'appStoreVersionLocalizations',
                      'id': loc_id,
                      'attributes': {'description': new_desc}
                  }
              })
              print(f'Apple EULA appended to {locale} description.')

          # Re-read and hard-gate the EULA before any submission action.
          verify_locs = call('GET', f'/appStoreVersions/{version_id}/appStoreVersionLocalizations', params={
              'limit': '50',
              'fields[appStoreVersionLocalizations]': 'locale,description'
          })['data']
          for loc in verify_locs:
              locale = loc.get('attributes', {}).get('locale', 'unknown')
              desc = (loc.get('attributes', {}).get('description') or '').rstrip()
              if not desc.endswith('Terms of Use (EULA): ' + EULA_URL):
                  print(f'EULA final-position verification failed for {locale}')
                  raise SystemExit(1)
          print('EULA final-position verification passed for all descriptions.')

          builds = call('GET', '/builds', params={
              'filter[app]': app_id,
              'filter[version]': build_number,
              'limit': '20',
              'sort': '-uploadedDate',
              'fields[builds]': 'version,uploadedDate,processingState,buildAudienceType,usesNonExemptEncryption'
          })['data']
          valid = [b for b in builds if b.get('attributes',{}).get('processingState') == 'VALID']
          if not valid:
              print('Build 16 is not VALID/available yet.')
              raise SystemExit(1)
          build_id = valid[0]['id']
          print('Build 16 VALID:', build_id)

          call('PATCH', f'/appStoreVersions/{version_id}/relationships/build', body={
              'data': {'type': 'builds', 'id': build_id}
          }, ok=(204,))
          print('Build 16 attached to App Store version.')

          if state in {'WAITING_FOR_REVIEW','IN_REVIEW','PENDING_APPLE_RELEASE','PENDING_DEVELOPER_RELEASE','PROCESSING_FOR_DISTRIBUTION','READY_FOR_DISTRIBUTION','READY_FOR_SALE'}:
              print('Version is already submitted or beyond submission state:', state)
              sys.exit(0)

          submissions = call('GET', f'/apps/{app_id}/reviewSubmissions', params={
              'filter[platform]': 'IOS',
              'limit': '50',
              'fields[reviewSubmissions]': 'platform,submittedDate,state'
          })['data']
          active = [s for s in submissions if s.get('attributes',{}).get('state') == 'READY_FOR_REVIEW']
          if active:
              submission = active[0]
              print('Using existing READY_FOR_REVIEW submission:', submission['id'])
          else:
              submission = call('POST', '/reviewSubmissions', body={
                  'data': {
                      'type': 'reviewSubmissions',
                      'attributes': {'platform': 'IOS'},
                      'relationships': {'app': {'data': {'type': 'apps', 'id': app_id}}}
                  }
              })['data']
              print('Created review submission:', submission['id'])
          submission_id = submission['id']

          items = call('GET', f'/reviewSubmissions/{submission_id}/items', params={'limit': '200'})['data']
          linked = False
          for item in items:
              rel = item.get('relationships', {}).get('appStoreVersion', {}).get('data')
              if rel and rel.get('id') == version_id:
                  linked = True
                  break
          if not linked:
              call('POST', '/reviewSubmissionItems', body={
                  'data': {
                      'type': 'reviewSubmissionItems',
                      'relationships': {
                          'reviewSubmission': {'data': {'type': 'reviewSubmissions', 'id': submission_id}},
                          'appStoreVersion': {'data': {'type': 'appStoreVersions', 'id': version_id}}
                      }
                  }
              })
              print('App Store version added to review submission.')

          result = call('PATCH', f'/reviewSubmissions/{submission_id}', body={
              'data': {
                  'type': 'reviewSubmissions',
                  'id': submission_id,
                  'attributes': {'submitted': True}
              }
          })['data']
          print('SUBMITTED TO APP REVIEW. State:', result.get('attributes', {}).get('state'))
          print('Review submission id:', submission_id)
          PY
