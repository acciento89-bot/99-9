name: SHK Store Finalizer Pointer

on:
  workflow_run:
    workflows: ["SHK App Store Finalize and Submit"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Write finalizer status
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --argjson run_id "$RUN_ID" \
            --arg status "$RUN_STATUS" \
            --arg conclusion "$RUN_CONCLUSION" \
            --arg url "$RUN_URL" \
            --arg head_sha "$HEAD_SHA" \
            --arg updated_at "$UPDATED_AT" \
            '{run_id:$run_id,status:$status,conclusion:$conclusion,url:$url,head_sha:$head_sha,updated_at:$updated_at}' \
            > .github/shk-store-last-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/shk-store-last-run.json
          git commit -m 'chore: record SHK store finalizer run' || exit 0
          git push origin HEAD:main
