name: 99.9 Android Play Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"

jobs:
  android-play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Godot Android toolchain
        run: |
          set -euo pipefail
          bash scripts/ci_install_admob.sh android
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" templates android/build build/android
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q templates.tpz -d templates
          cp -R templates/templates/. "$T/"
          unzip -q "$T/android_source.zip" -d android/build
          printf '%s\n' "${GODOT_VERSION}.stable" > android/.build_version
          chmod +x android/build/gradlew
      - name: Export release AAB
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > build/android/ninenine-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          import os
          preset = Path("export_presets.cfg")
          text = preset.read_text()
          text = text.replace('export_path="build/android/99-9.apk"', 'export_path="build/android/99-9.aab"')
          text = text.replace('gradle_build/target_sdk="35"', 'gradle_build/target_sdk="36"')
          if 'gradle_build/export_format=1' not in text:
              text = text.replace(
                  'gradle_build/gradle_build_directory="android"',
                  'gradle_build/gradle_build_directory="android"\n'
                  'gradle_build/export_format=1'
              )
          if 'keystore/release=' not in text:
              text = text.replace(
                  'gradle_build/export_format=1',
                  'gradle_build/export_format=1\n'
                  'keystore/release="build/android/ninenine-upload.jks"\n'
                  'keystore/release_user="upload"\n'
                  f'keystore/release_password="{os.environ["ANDROID_UPLOAD_KEYSTORE_PASSWORD"]}"'
              )
          preset.write_text(text)
          PY
          ./godot --headless --editor --path . --quit
          ./godot --headless --path . --export-release "Android Playtest" build/android/99-9.aab
          test -s build/android/99-9.aab
          unzip -l build/android/99-9.aab | grep -Ei "GodotIap|billing" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: 99-9-play-aab
          path: build/android/99-9.aab
          if-no-files-found: error
          retention-days: 7
      - name: Publish transfer prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ninenine-play-1.0.2-3
          name: 99.9% Play 1.0.2 (3)
          prerelease: true
          make_latest: false
          files: build/android/99-9.aab
