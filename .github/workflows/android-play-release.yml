name: 99.9 Android Play Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-play-release.yml'
      - 'assets/icon.svg'
      - 'assets/android/**'
      - 'store/google-play/**'
      - 'scripts/check_launcher_icons.py'
      - 'scripts/export_launcher_icons.py'

permissions:
  contents: read
  id-token: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  PACKAGE_NAME: de.kamilunavo.ninenine
  EXPECTED_VERSION_CODE: '4'
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  android-play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Validate identical launcher and Store artwork
        run: |
          python3 -m pip install Pillow
          python3 scripts/check_launcher_icons.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Godot Android toolchain
        run: |
          set -euo pipefail
          bash scripts/ci_install_admob.sh android
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" templates android/build build/android
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q templates.tpz -d templates
          cp -R templates/templates/. "$T/"
          unzip -q "$T/android_source.zip" -d android/build
          printf '%s\n' "${GODOT_VERSION}.stable" > android/.build_version
          chmod +x android/build/gradlew
      - name: Restore upload identity from KMS vault
        uses: acciento89-bot/maengelfix/.github/actions/restore-android-signing@main
        with: {app-id: ninenine}
      - name: Export signed release AAB
        run: |
          set -euo pipefail
          mkdir -p build/android
          python3 - <<'PY'
          from pathlib import Path
          import os
          preset = Path('export_presets.cfg')
          text = preset.read_text()
          text = text.replace('export_path="build/android/99-9.apk"', 'export_path="build/android/99-9.aab"')
          text = text.replace('gradle_build/target_sdk="35"', 'gradle_build/target_sdk="36"')
          if 'gradle_build/export_format=1' not in text:
              text = text.replace('gradle_build/gradle_build_directory="android"', 'gradle_build/gradle_build_directory="android"\ngradle_build/export_format=1')
          lines = [line for line in text.splitlines() if not line.startswith('keystore/release=') and not line.startswith('keystore/release_user=') and not line.startswith('keystore/release_password=')]
          text = '\n'.join(lines) + '\n'
          anchor = 'gradle_build/export_format=1'
          signing = '\n'.join([
              'keystore/release="' + os.environ['ANDROID_UPLOAD_KEYSTORE_PATH'] + '"',
              'keystore/release_user="' + os.environ['ANDROID_UPLOAD_KEY_ALIAS'] + '"',
              'keystore/release_password="' + os.environ['ANDROID_UPLOAD_KEY_PASSWORD'] + '"',
          ])
          text = text.replace(anchor, anchor + '\n' + signing)
          preset.write_text(text)
          PY
          ./godot --headless --editor --path . --quit
          ./godot --headless --path . --export-release "Android Playtest" build/android/99-9.aab
          test -s build/android/99-9.aab
          unzip -l build/android/99-9.aab | grep -Ei "GodotIap|billing" >/dev/null
          jarsigner -verify build/android/99-9.aab | grep -Fq 'jar verified.'
          echo "AAB_PATH=$GITHUB_WORKSPACE/build/android/99-9.aab" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: 99-9-play-1.0.3-4-signed-aab
          path: build/android/99-9.aab
          if-no-files-found: error
          retention-days: 30
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Verify current bundle is present in Google Play
        env: {TOKEN: '${{ steps.google-auth.outputs.access_token }}'}
        shell: bash
        run: |
          set -euo pipefail
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          edit=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -r '.id')
          bundles=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit/bundles")
          jq -e --argjson code "$EXPECTED_VERSION_CODE" '.bundles | any(.versionCode == $code)' <<<"$bundles" >/dev/null
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit" >/dev/null
          echo "$PACKAGE_NAME versionCode $EXPECTED_VERSION_CODE is present in Google Play"
      - name: Destroy restored signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kamilunavo-upload.jks"
          rm -rf "$RUNNER_TEMP/kamilunavo-signing-vault"
