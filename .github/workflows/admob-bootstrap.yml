name: Bootstrap AdMob v5

on:
  push:
    branches: [feature/build8-admob-test]
    paths:
      - '.github/workflows/admob-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/build8-admob-test

      - name: Inspect release and vendor Godot editor addon
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admob"
          gh api repos/poingstudios/godot-admob-plugin/releases/tags/v5.0.0 > "$RUNNER_TEMP/release.json"
          jq -r '.assets[].name' "$RUNNER_TEMP/release.json" | tee "$RUNNER_TEMP/assets.txt"

          mkdir -p docs
          {
            echo '# AdMob v5.0.0 release assets'
            echo
            cat "$RUNNER_TEMP/assets.txt"
          } > docs/ADMOB_BOOTSTRAP_ASSETS.txt

          ASSET=$(jq -r '[.assets[].name | select(test("godot-admob"; "i")) | select(endswith(".zip")) | select(test("template|android|ios|csharp"; "i")|not)][0] // empty' "$RUNNER_TEMP/release.json")
          if [[ -z "$ASSET" ]]; then
            ASSET=$(jq -r '[.assets[].name | select(endswith(".zip")) | select(test("template|android|ios|csharp"; "i")|not)][0] // empty' "$RUNNER_TEMP/release.json")
          fi
          if [[ -z "$ASSET" ]]; then
            echo 'Could not identify editor addon zip.' >&2
            exit 1
          fi
          echo "Selected editor asset: $ASSET"
          gh release download v5.0.0 --repo poingstudios/godot-admob-plugin --pattern "$ASSET" --dir "$RUNNER_TEMP/admob"
          unzip -q "$RUNNER_TEMP/admob/$ASSET" -d "$RUNNER_TEMP/admob/extracted"

          ADDON=$(find "$RUNNER_TEMP/admob/extracted" -type d -path '*/addons/admob' | head -1)
          if [[ -z "$ADDON" ]]; then
            echo 'addons/admob not found in selected release package.' >&2
            find "$RUNNER_TEMP/admob/extracted" -maxdepth 4 -type d | sort | head -200
            exit 1
          fi
          rm -rf addons/admob
          mkdir -p addons
          cp -R "$ADDON" addons/admob

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addons/admob docs/ADMOB_BOOTSTRAP_ASSETS.txt
          if git diff --cached --quiet; then
            echo 'No AdMob bootstrap changes.'
            exit 0
          fi
          git commit -m 'Vendor Godot AdMob 5.0.0 editor addon'
          git push origin HEAD:feature/build8-admob-test
