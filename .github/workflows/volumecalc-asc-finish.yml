name: VolumeCalc ASC Finish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/volumecalc-asc-finish-request.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finish:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v5

      - name: Update and verify VolumeCalc App Store description
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        shell: bash
        run: bash .github/scripts/volumecalc_description_update.sh
