name: 99.9 iOS Build Check

on:
  push:
    branches: [main, 'agent/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'

jobs:
  godot-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install AdMob iOS native templates for editor validation
        shell: bash
        run: bash scripts/ci_install_admob.sh ios
      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" godot
          chmod +x godot
      - name: Parse project
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit 2>&1 | tee parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Error.*SVG" parse.log; then exit 1; fi
      - name: Main-scene smoke test
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --quit-after 5 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" smoke.log; then exit 1; fi

  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify live global leaderboard endpoint
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import re, shlex
          text=open('scripts/leaderboard_service.gd', encoding='utf-8').read()
          url=re.search(r'const FUNCTION_URL := \"([^\"]+)\"', text)
          key=re.search(r'const ANON_KEY := \"([^\"]+)\"', text)
          if not url or not key: raise SystemExit('Leaderboard client configuration not found')
          print('FUNCTION_URL='+shlex.quote(url.group(1)))
          print('ANON_KEY='+shlex.quote(key.group(1)))
          PY
          )"
          curl --fail-with-body -sS -H "Authorization: Bearer $ANON_KEY" -H "apikey: $ANON_KEY" "$FUNCTION_URL?mode=hit&limit=1&player_id=00000000-0000-4000-8000-000000000002" -o leaderboard.json
          jq -e '.mode == "hit" and (.top | type == "array")' leaderboard.json >/dev/null

  ios-unsigned:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot, templates and AdMob iOS native package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci_install_admob.sh ios
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          mkdir -p "$RUNNER_TEMP/godot" && unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"; echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"; mkdir -p "$T"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" && unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$T/"
          test -f "$T/ios.zip"
          test -f addons/admob/ios/bin/ads/poing_godot_admob_ads.gd
      - name: Import, export and verify IAP + AdMob Xcode project
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'GodotIapPlugin="*res://addons/godot-iap/godot_iap_ios_safe.gd"' project.godot || { echo 'Safe IAP autoload is not configured'; exit 1; }
          grep -Fq 'add_autoload_singleton(AUTOLOAD_NAME, "res://addons/godot-iap/godot_iap_ios_safe.gd")' addons/godot-iap/godot_iap_plugin.gd || { echo 'Editor plugin would restore unsafe IAP autoload'; exit 1; }
          "$GODOT" --headless --editor --path . --quit
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS Playtest" build/ios/NineNine.zip
          test -d build/ios/NineNine.xcodeproj
          test -d addons/godot-iap/bin/ios/GodotIap.framework
          chmod +x addons/godot-iap/scripts/fix_ios_embed.sh
          IOS_EXPORT_DIR="$PWD/build/ios" ./addons/godot-iap/scripts/fix_ios_embed.sh
          grep -q 'GodotIap.framework' build/ios/NineNine.xcodeproj/project.pbxproj
          IOS_ADMOB_APP_ID=$(sed -n 's/^general\/ios\/app_id="\([^"]*\)"/\1/p' project.godot | head -n1)
          test -n "$IOS_ADMOB_APP_ID" || { echo 'AdMob iOS App ID missing from project.godot'; exit 1; }
          grep -R -Fq "$IOS_ADMOB_APP_ID" build/ios || { echo "Configured AdMob iOS App ID missing from export: $IOS_ADMOB_APP_ID"; exit 1; }
          grep -R -q 'GoogleMobileAds' build/ios || { echo 'Google Mobile Ads SPM integration missing'; exit 1; }
          xcodebuild -project build/ios/NineNine.xcodeproj -list -json > "$RUNNER_TEMP/xcode.json"
          SCHEME=$(python3 - <<'PY2'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/xcode.json'))['project']
          print((d.get('schemes') or d.get('targets') or [''])[0])
          PY2
          )
          test -n "$SCHEME"
          xcodebuild -project build/ios/NineNine.xcodeproj -scheme "$SCHEME" -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          ditto -c -k --sequesterRsrc build/ios/NineNine.xcodeproj build/ios/NineNine-Xcode.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 99-9-ios-unsigned
          path: build/ios/NineNine-Xcode.zip
          if-no-files-found: error
          retention-days: 14
