name: 99.9 iOS Build Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appstore-final-submit:
    name: Finalize App Store Connect and submit Build 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v5
      - name: Install ASC dependencies
        run: python3 -m pip install --quiet pyjwt cryptography requests
      - name: Fill review contact, verify metadata, and submit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time, base64, json
          import jwt, requests

          BASE='https://api.appstoreconnect.apple.com/v1'
          BUNDLE='de.kamilunavo.ninenine'
          BUILD='16'
          EULA='Terms of Use (EULA): https://www.apple.com/legal/internet-services/itunes/dev/stdeula/'
          NOTES='99.9% is a one-tap precision game and does not require an account or login.\n\nReview path:\n1. Tap PLAY.\n2. Tap once to start the percentage run and tap again to stop it.\n3. Reaching 99.900% or higher continues the streak.\n4. WORLD LEADERBOARD shows best-hit and longest-streak rankings using a locally generated player ID and a user-selected display name.\n5. SETTINGS contains player-name settings plus purchase and restore options.\n\nOptional StoreKit in-app purchases unlock visual themes and Remove Ads. Google Mobile Ads/UMP is used for advertising and consent. No external payment method is used.'

          kid=os.environ['ASC_KEY_ID']; issuer=os.environ['ASC_ISSUER_ID']; raw=os.environ['ASC_PRIVATE_KEY_B64']
          key=base64.b64decode(raw).decode(); now=int(time.time())
          token=jwt.encode({'iss':issuer,'iat':now,'exp':now+1100,'aud':'appstoreconnect-v1'},key,algorithm='ES256',headers={'kid':kid,'typ':'JWT'})
          H={'Authorization':f'Bearer {token}','Content-Type':'application/json'}

          def req(method,path,params=None,body=None,ok=(200,201,204),allow=()):
              r=requests.request(method,BASE+path,headers=H,params=params,json=body,timeout=60)
              if r.status_code in allow:
                  return None
              if r.status_code not in ok:
                  print(f'ASC ERROR {method} {path}: HTTP {r.status_code}')
                  try: print(json.dumps(r.json(),indent=2))
                  except Exception: print(r.text)
                  raise RuntimeError(f'{method} {path} HTTP {r.status_code}')
              if r.status_code==204 or not r.content: return None
              return r.json()

          apps=req('GET','/apps',{'filter[bundleId]':BUNDLE,'limit':'5'})['data']
          if len(apps)!=1: raise RuntimeError('99.9 app lookup failed')
          app_id=apps[0]['id']
          req('PATCH',f'/apps/{app_id}',body={'data':{'type':'apps','id':app_id,'attributes':{'contentRightsDeclaration':'USES_THIRD_PARTY_CONTENT'}}})

          versions=req('GET',f'/apps/{app_id}/appStoreVersions',{'filter[platform]':'IOS','limit':'50','fields[appStoreVersions]':'versionString,appVersionState'})['data']
          versions=[v for v in versions if v.get('attributes',{}).get('versionString') in ('1.0','1.0.0')]
          if not versions: raise RuntimeError('App Store version 1.0 missing')
          editable={'PREPARE_FOR_SUBMISSION','READY_FOR_REVIEW','DEVELOPER_REJECTED','METADATA_REJECTED','REJECTED'}
          version=next((v for v in versions if v.get('attributes',{}).get('appVersionState') in editable),versions[0])
          version_id=version['id']

          locs=req('GET',f'/appStoreVersions/{version_id}/appStoreVersionLocalizations',{'limit':'50','fields[appStoreVersionLocalizations]':'locale,description'})['data']
          if not locs: raise RuntimeError('No localization found')
          for loc in locs:
              desc=(loc.get('attributes',{}).get('description') or '').rstrip()
              if len(desc)<500 or not desc.endswith(EULA):
                  raise RuntimeError('Description is not fully restored with EULA at end')
          print('DESCRIPTION + EULA VERIFIED')

          builds=req('GET','/builds',{'filter[app]':app_id,'filter[version]':BUILD,'limit':'20','sort':'-uploadedDate','fields[builds]':'version,processingState'})['data']
          valid=[b for b in builds if b.get('attributes',{}).get('processingState')=='VALID']
          if not valid: raise RuntimeError('Build 16 not VALID')
          req('PATCH',f'/appStoreVersions/{version_id}/relationships/build',body={'data':{'type':'builds','id':valid[0]['id']}},ok=(204,))

          detail=req('GET',f'/appStoreVersions/{version_id}/appStoreReviewDetail')['data']
          attrs=detail.get('attributes',{})
          fields=['contactFirstName','contactLastName','contactPhone','contactEmail']
          missing=[k for k in fields if not attrs.get(k)]
          if missing:
              all_apps=req('GET','/apps',{'limit':'200'})['data']
              donor=None
              for app in all_apps:
                  aid=app['id']
                  if aid==app_id: continue
                  try:
                      ovs=req('GET',f'/apps/{aid}/appStoreVersions',{'filter[platform]':'IOS','limit':'50','fields[appStoreVersions]':'versionString'})['data']
                  except Exception:
                      continue
                  for ov in ovs:
                      r=requests.get(BASE+f"/appStoreVersions/{ov['id']}/appStoreReviewDetail",headers=H,timeout=30)
                      if r.status_code!=200: continue
                      od=(r.json().get('data') or {}).get('attributes',{})
                      if all(od.get(k) for k in fields):
                          donor={k:od[k] for k in fields}
                          break
                  if donor: break
              if not donor: raise RuntimeError('No existing complete App Review contact found in other apps')
              patch=dict(donor); patch['notes']=NOTES
              req('PATCH',f"/appStoreReviewDetails/{detail['id']}",body={'data':{'type':'appStoreReviewDetails','id':detail['id'],'attributes':patch}})
              print('REVIEW CONTACT COPIED FROM EXISTING APP; NOTES SET')
          else:
              req('PATCH',f"/appStoreReviewDetails/{detail['id']}",body={'data':{'type':'appStoreReviewDetails','id':detail['id'],'attributes':{'notes':NOTES}}})
              print('REVIEW CONTACT VERIFIED; NOTES SET')

          detail2=req('GET',f'/appStoreVersions/{version_id}/appStoreReviewDetail')['data']
          if not all(detail2.get('attributes',{}).get(k) for k in fields): raise RuntimeError('Review contact verification failed')
          if not detail2.get('attributes',{}).get('notes'): raise RuntimeError('Review notes verification failed')

          state=version.get('attributes',{}).get('appVersionState')
          if state in {'WAITING_FOR_REVIEW','IN_REVIEW'}:
              print('FINAL SUCCESS',state)
              raise SystemExit(0)

          subs=req('GET',f'/apps/{app_id}/reviewSubmissions',{'limit':'100','fields[reviewSubmissions]':'platform,state'})['data']
          ready=[s for s in subs if s.get('attributes',{}).get('state')=='READY_FOR_REVIEW']
          sub=ready[0] if ready else req('POST','/reviewSubmissions',body={'data':{'type':'reviewSubmissions','attributes':{'platform':'IOS'},'relationships':{'app':{'data':{'type':'apps','id':app_id}}}}})['data']
          sid=sub['id']
          items=req('GET',f'/reviewSubmissions/{sid}/items',{'limit':'200','include':'appStoreVersion','fields[reviewSubmissionItems]':'state,appStoreVersion','fields[appStoreVersions]':'versionString'})['data']
          linked=any((i.get('relationships',{}).get('appStoreVersion',{}).get('data') or {}).get('id')==version_id for i in items)
          if not linked:
              req('POST','/reviewSubmissionItems',body={'data':{'type':'reviewSubmissionItems','relationships':{'reviewSubmission':{'data':{'type':'reviewSubmissions','id':sid}},'appStoreVersion':{'data':{'type':'appStoreVersions','id':version_id}}}}})
          result=req('PATCH',f'/reviewSubmissions/{sid}',body={'data':{'type':'reviewSubmissions','id':sid,'attributes':{'submitted':True}}})['data']
          final=result.get('attributes',{}).get('state')
          for _ in range(18):
              if final in {'WAITING_FOR_REVIEW','IN_REVIEW'}: break
              time.sleep(5)
              final=req('GET',f'/reviewSubmissions/{sid}')['data'].get('attributes',{}).get('state')
          if final not in {'WAITING_FOR_REVIEW','IN_REVIEW'}: raise RuntimeError('Submission state '+str(final))
          print('FINAL SUCCESS',final)
          PY
