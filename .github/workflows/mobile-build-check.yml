name: 99.9 Apple Review Guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Apple review source
        uses: actions/checkout@v5

      - name: Sanitize Apple review export copy
        shell: bash
        run: bash scripts/prepare_ios_app_review_export.sh

      - name: Verify Apple-only customer-facing source
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -Ei 'android|google play|play store' scripts --include='*.gd'
          ! grep -n -Ei 'android|google play|play store' project.godot
          grep -q 'res://scripts/main_v12_app_review.gd' scenes/main.tscn
          grep -q 'res://scripts/iap_service_ios_safe.gd' scenes/main.tscn
          grep -q 'res://scripts/ads_service_ios_safe.gd' scenes/main.tscn
          grep -q 'application/bundle_identifier="de.kamilunavo.ninenine"' export_presets.cfg
          echo 'Apple review guard passed: no Android/Google Play wording in app-facing source.'
