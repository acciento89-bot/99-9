name: SHK Build 3 Review Run Pointer

on:
  workflow_run:
    workflows: ["SHK Build 3 Review Replace"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Record completed run
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --argjson id "$RUN_ID" --arg status "$RUN_STATUS" --arg conclusion "$RUN_CONCLUSION" --arg url "$RUN_URL" --arg sha "$RUN_SHA" '{run_id:$id,status:$status,conclusion:$conclusion,url:$url,head_sha:$sha}' > .github/shk-build3-review-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/shk-build3-review-run.json
          git commit -m 'chore: record SHK build 3 review run' || exit 0
          git push origin HEAD:main
