name: 99.9 Build 17 Unsigned Bridge Artifact

on:
  push:
    branches:
      - ios/app-review-build17
    paths:
      - .github/workflows/ios-build17-appstore-upload-v2.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'
  BUNDLE_ID: 'de.kamilunavo.ninenine'
  APP_VERSION: '1.0.0'
  BUILD_NUMBER: '17'

jobs:
  build-unsigned:
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - name: Checkout Build 17 source
        uses: actions/checkout@v5

      - name: Verify Build 17 App Review source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ios/app-review-build17'
          grep -q 'res://scripts/main_v12_app_review.gd' scenes/main.tscn
          grep -q 'RESTORE PURCHASES' scripts/main_v12_app_review.gd
          grep -q 'restore_theme_purchases' scripts/main_v12_app_review.gd
          grep -q 'Engine.has_singleton("GodotxATT")' scripts/ads_service_ios_safe.gd
          grep -q 'ATT_AUTHORIZED' scripts/ads_service_ios_safe.gd
          grep -q 'NSUserTrackingUsageDescription' export_presets.cfg
          grep -q 'plugins/GodotxATT=true' export_presets.cfg
          grep -q 'application/version="17"' export_presets.cfg
          grep -q 'GodotIapPlugin="\*res://addons/godot-iap/godot_iap_ios_safe.gd"' project.godot
          ! grep -q 'com.kamilunavo.game999' project.godot scripts/*.gd export_presets.cfg

      - name: Install Godot and native iOS plugins
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci_install_admob.sh ios
          bash scripts/ci_install_share_ios.sh
          bash scripts/ci_install_att_ios.sh

          test -f addons/admob/ios/bin/ads/poing_godot_admob_ads.gd
          test -f addons/godot-iap/bin/ios/GodotIap.framework/GodotIap
          test -f addons/godot-iap/bin/ios/SwiftGodotRuntime.framework/SwiftGodotRuntime
          test -f ios/plugins/share/share.gdip
          test -f ios/plugins/att/att.gdip
          find ios/plugins/att -maxdepth 1 -name 'GodotxATT*.xcframework' -print -quit | grep -q .

          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" "$RUNNER_TEMP/templates"
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$T/"
          test -f "$T/ios.zip"

      - name: Prepare App Store-only copy
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare_ios_app_review_export.sh

      - name: Parse and smoke test
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/parse.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' "$RUNNER_TEMP/parse.log"; then exit 1; fi
          "$GODOT" --headless --path . --quit-after 3 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' "$RUNNER_TEMP/smoke.log"; then exit 1; fi

      - name: Export Build 17 Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          rm -rf build/ios/NineNine build/ios/NineNine.xcodeproj build/ios/NineNine.xcframework build/ios/MoltenVK.xcframework build/ios/PrivacyInfo.xcprivacy
          "$GODOT" --headless --path . --export-release "iOS Playtest" build/ios/NineNine.zip
          test -d build/ios/NineNine.xcodeproj

          chmod +x addons/godot-iap/scripts/fix_ios_embed.sh
          IOS_EXPORT_DIR="$PWD/build/ios" ./addons/godot-iap/scripts/fix_ios_embed.sh

          PBX="$PWD/build/ios/NineNine.xcodeproj/project.pbxproj"
          INFO_PLIST="$PWD/build/ios/NineNine/NineNine-Info.plist"
          test -f "$PBX"
          test -f "$INFO_PLIST"
          grep -q 'GodotIap.framework' "$PBX"
          grep -q 'SwiftGodotRuntime.framework' "$PBX"
          grep -R -q 'GoogleMobileAds' build/ios
          grep -Ei -q 'share(\.release)?\.a|share\.a' "$PBX"
          grep -q 'GodotxATT' "$PBX"
          grep -Fq "$BUNDLE_ID" "$PBX"
          grep -Eq 'CURRENT_PROJECT_VERSION = 17;' "$PBX"
          /usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$INFO_PLIST" | grep -q 'advertising identifier'

          PCK=$(find build/ios -type f -name 'NineNine.pck' -print -quit)
          test -n "$PCK" -a -s "$PCK"
          ! strings "$PCK" | grep -F 'iOS + ANDROID'
          ! strings "$PCK" | grep -F 'iOS + Android'
          ! strings "$PCK" | grep -F 'Store available on iOS / Android device'

          echo "XCODE_PROJECT=$PWD/build/ios/NineNine.xcodeproj" >> "$GITHUB_ENV"
          echo "SOURCE_INFO_PLIST=$INFO_PLIST" >> "$GITHUB_ENV"
          echo "PBXPROJ=$PBX" >> "$GITHUB_ENV"

      - name: Restore referenced XCFramework dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, shutil, sys
          root = pathlib.Path.cwd()
          out = root / 'build' / 'ios'
          pbx = out / 'NineNine.xcodeproj' / 'project.pbxproj'
          text = pbx.read_text(errors='replace')
          path_values = re.findall(r'\bpath\s*=\s*"?([^";]+\.xcframework)"?\s*;', text)
          names = sorted({pathlib.Path(value).name for value in path_values})
          search_roots = [pathlib.Path(os.environ['RUNNER_TEMP']) / 'ninenine-admob-native', root / 'addons', root / 'ios']
          missing = []
          for name in names:
              dest = out / name
              if dest.is_dir():
                  continue
              candidates = []
              for base in search_roots:
                  if base.exists():
                      candidates.extend([p for p in base.rglob(name) if p.is_dir() and p.resolve() != dest.resolve()])
              if not candidates:
                  stem = name[:-len('.xcframework')]
                  for base in search_roots:
                      if base.exists():
                          candidates.extend([p for p in base.rglob(f'{stem}*.xcframework') if p.is_dir() and p.resolve() != dest.resolve()])
              if not candidates:
                  missing.append(name)
                  continue
              src = min(candidates, key=lambda p: (len(p.parts), str(p)))
              shutil.copytree(src, dest, symlinks=True)
          if missing:
              print('Missing XCFramework dependencies: ' + ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Sanitize generated project
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleSupportedPlatforms' "$SOURCE_INFO_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Set :ITSAppUsesNonExemptEncryption false' "$SOURCE_INFO_PLIST" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' "$SOURCE_INFO_PLIST"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 17\.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PBXPROJ"

      - name: Resolve Xcode scheme and packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$XCODE_PROJECT" -list -json > "$RUNNER_TEMP/xcode-list.json"
          SCHEME=$(python3 - <<'PY'
          import json, os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/xcode-list.json')).get('project',{})
          print((d.get('schemes') or d.get('targets') or [''])[0])
          PY
          )
          test -n "$SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$SCHEME"

      - name: Create unsigned Build 17 archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/NineNine-Build17-unsigned.xcarchive"
          rm -rf "$ARCHIVE"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx "$BUNDLE_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx "$APP_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx "$BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$APP/Info.plist" | grep -q 'advertising identifier'
          test -d "$APP/Frameworks/GoogleMobileAds.framework"
          test -d "$APP/Frameworks/UserMessagingPlatform.framework"
          test -d "$APP/Frameworks/GodotIap.framework"
          test -d "$APP/Frameworks/SwiftGodotRuntime.framework"

          ditto -c -k --keepParent "$ARCHIVE" "$GITHUB_WORKSPACE/NineNine-Build17-unsigned.xcarchive.zip"
          test -s "$GITHUB_WORKSPACE/NineNine-Build17-unsigned.xcarchive.zip"

      - name: Upload unsigned Build 17 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 99-9-build17-unsigned-xcarchive
          path: NineNine-Build17-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 14

      - name: Final summary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 99.9 Build 17 unsigned bridge artifact
          - Build 17 exported and archived with CODE_SIGNING_ALLOWED=NO
          - no codesign step
          - no cloud signing
          - no App Store Connect validation/upload from this repository
          - unsigned xcarchive uploaded as GitHub artifact for the signing bridge
          EOF
