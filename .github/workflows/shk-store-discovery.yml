name: SHK Store Run Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/shk-store-discovery-request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Discover latest SHK store finalizer run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${REPO}/actions/workflows/shk-appstore-finalize.yml/runs?per_page=10"
          RESPONSE=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API")
          jq '{workflow_runs:[.workflow_runs[] | {id,status,conclusion,event,head_sha,created_at,updated_at,html_url}]}' <<<"$RESPONSE" > .github/shk-store-discovery.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/shk-store-discovery.json
          git commit -m 'chore: record SHK store finalizer discovery' || exit 0
          git push origin HEAD:main
